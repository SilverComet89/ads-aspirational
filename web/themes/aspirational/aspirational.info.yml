  sidebar_first: 'Primary'
  sidebar_second: 'Secondary'
  contact: 'Contact'
  footer: 'Footer'
  page_top: 'Page top'
  page_bottom: 'Page bottom'

libraries:
  - 'aspirational/global-styling'
  - 'aspirational/bootstrap-scripts'
